version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revofashion_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - SECRET_KEY=docker_dev_secret_key
      - JWT_SECRET_KEY=docker_dev_jwt_secret_key
      # For Supabase: paste your Supabase URI here or pass via .env
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/revoshop_db}
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: revofashion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revoshop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
